[project]
name = "python-daily"
version = "0.1.0"
description = "7-day spiral Python practice: snippets, practice + solution notebooks"
requires-python = ">=3.12"
dependencies = [
    "jupyterlab>=4",
    "ipykernel>=6",
    "nbformat>=5.9",
    "nbclient>=0.10",
]

[dependency-groups]
dev = ["mypy", "pytest"]

[tool.uv]
package = false
